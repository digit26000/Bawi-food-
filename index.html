<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bawi Food</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-inner">
      <span class="logo-mono">B.F</span>
    </div>
  </div>
  <p class="logo-placeholder-tag">(logo à remplacer dès réception)</p>

  <p class="address">5 rue Mozart, Bourg-lès-Valence</p>
  <p class="address-sub">Kebab · Tacos · Pizza</p>

  <div class="hours">
    <p class="hours-title">Horaires</p>
    <div class="hours-row"><span class="hours-day">Lundi</span><span class="hours-time">11h-14h · 18h-22h</span></div>
    <div class="hours-row"><span class="hours-day">Mardi</span><span class="hours-time">11h-14h · 18h-22h</span></div>
    <div class="hours-row"><span class="hours-day">Mercredi</span><span class="hours-time closed">Fermé</span></div>
    <div class="hours-row"><span class="hours-day">Jeudi</span><span class="hours-time">11h-14h · 18h-22h</span></div>
    <div class="hours-row"><span class="hours-day">Vendredi</span><span class="hours-time">11h-14h · 18h-22h</span></div>
    <div class="hours-row"><span class="hours-day">Samedi</span><span class="hours-time">11h-14h · 18h-22h</span></div>
    <div class="hours-row"><span class="hours-day">Dimanche</span><span class="hours-time">18h-22h</span></div>
  </div>

  <a href="menu.html" class="menu-btn">
    Voir le menu
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </a>

</div>
</body>
</html>
